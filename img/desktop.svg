<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Versão desktop do dashboard">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f3f6fb"/>
      <stop offset="100%" stop-color="#edf4ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1400" height="110" rx="20" fill="url(#header)"/>
  <text x="70" y="70" font-size="42" font-family="Verdana, Arial, sans-serif" font-weight="700" fill="#ffffff">DashBoard Pro</text>
  <text x="900" y="70" font-size="20" font-family="Verdana, Arial, sans-serif" fill="#dfe9ff">Início</text>
  <text x="990" y="70" font-size="20" font-family="Verdana, Arial, sans-serif" fill="#dfe9ff">Sobre</text>
  <text x="1080" y="70" font-size="20" font-family="Verdana, Arial, sans-serif" fill="#dfe9ff">Benefícios</text>
  <text x="1215" y="70" font-size="20" font-family="Verdana, Arial, sans-serif" fill="#dfe9ff">Contato</text>

  <rect x="70" y="150" width="910" height="530" rx="28" fill="#ffffff"/>
  <rect x="980" y="150" width="350" height="530" rx="28" fill="#eef5ff"/>

  <rect x="110" y="210" width="450" height="150" rx="18" fill="#dfeaff"/>
  <text x="145" y="245" font-size="26" font-family="Verdana, Arial, sans-serif" fill="#1d4ed8">Atividade</text>
  <g fill="#5a8bff">
    <rect x="130" y="320" width="32" height="110" rx="4"/>
    <rect x="190" y="290" width="32" height="140" rx="4"/>
    <rect x="250" y="260" width="32" height="170" rx="4"/>
    <rect x="310" y="300" width="32" height="130" rx="4"/>
    <rect x="370" y="240" width="32" height="190" rx="4"/>
    <rect x="430" y="260" width="32" height="170" rx="4"/>
    <rect x="490" y="210" width="32" height="220" rx="4"/>
  </g>

  <rect x="610" y="220" width="320" height="100" rx="16" fill="#f8fafc"/>
  <text x="650" y="245" font-size="22" font-family="Verdana, Arial, sans-serif" fill="#1e293b">Métricas</text>
  <g>
    <rect x="650" y="310" width="80" height="50" rx="12" fill="#e0ecff"/>
    <text x="680" y="344" text-anchor="middle" font-size="18" font-family="Verdana, Arial, sans-serif" fill="#1d4ed8">+42%</text>
    <rect x="770" y="310" width="80" height="50" rx="12" fill="#e0ecff"/>
    <text x="810" y="344" text-anchor="middle" font-size="18" font-family="Verdana, Arial, sans-serif" fill="#1d4ed8">+18%</text>
    <rect x="890" y="310" width="80" height="50" rx="12" fill="#e0ecff"/>
    <text x="930" y="344" text-anchor="middle" font-size="18" font-family="Verdana, Arial, sans-serif" fill="#1d4ed8">+9%</text>
  </g>

  <text x="112" y="520" font-size="38" font-family="Verdana, Arial, sans-serif" fill="#0f172a">Acompanhe seu negócio com clareza e rapidez.</text>
  <text x="112" y="630" font-size="22" font-family="Verdana, Arial, sans-serif" fill="#475569">Dashboard para monitorar vendas, produtividade e decisões em tempo real.</text>

  <g>
    <rect x="1010" y="200" width="280" height="82" rx="20" fill="#ffffff"/>
    <text x="1045" y="235" font-size="30" font-family="Verdana, Arial, sans-serif" fill="#16213d">24k</text>
    <text x="1045" y="260" font-size="19" font-family="Verdana, Arial, sans-serif" fill="#475569">Usuários</text>

    <rect x="1010" y="310" width="280" height="82" rx="20" fill="#ffffff"/>
    <text x="1045" y="345" font-size="30" font-family="Verdana, Arial, sans-serif" fill="#16213d">89%</text>
    <text x="1045" y="370" font-size="19" font-family="Verdana, Arial, sans-serif" fill="#475569">Satisfação</text>

    <rect x="1010" y="420" width="280" height="82" rx="20" fill="#ffffff"/>
    <text x="1045" y="455" font-size="30" font-family="Verdana, Arial, sans-serif" fill="#16213d">1.8M</text>
    <text x="1045" y="480" font-size="19" font-family="Verdana, Arial, sans-serif" fill="#475569">Vendas</text>

    <rect x="1010" y="530" width="280" height="82" rx="20" fill="#ffffff"/>
    <text x="1045" y="565" font-size="30" font-family="Verdana, Arial, sans-serif" fill="#16213d">4.9/5</text>
    <text x="1045" y="590" font-size="19" font-family="Verdana, Arial, sans-serif" fill="#475569">Notas</text>
  </g>

  <g>
    <rect x="70" y="730" width="380" height="150" rx="20" fill="#ffffff"/>
    <rect x="92" y="748" width="336" height="62" rx="14" fill="#dfeaff"/>
    <text x="108" y="820" font-size="24" font-family="Verdana, Arial, sans-serif" fill="#16213d">Relatórios claros</text>
    <text x="108" y="860" font-size="18" font-family="Verdana, Arial, sans-serif" fill="#475569">Dados claros</text>

    <rect x="490" y="730" width="380" height="150" rx="20" fill="#ffffff"/>
    <rect x="512" y="748" width="336" height="62" rx="14" fill="#dfeaff"/>
    <text x="528" y="820" font-size="24" font-family="Verdana, Arial, sans-serif" fill="#16213d">Estratégia em tempo real</text>
    <text x="528" y="860" font-size="18" font-family="Verdana, Arial, sans-serif" fill="#475569">Ações rápidas</text>

    <rect x="910" y="730" width="380" height="150" rx="20" fill="#ffffff"/>
    <rect x="932" y="748" width="336" height="62" rx="14" fill="#dfeaff"/>
    <text x="948" y="820" font-size="24" font-family="Verdana, Arial, sans-serif" fill="#16213d">Ações mais rápidas</text>
    <text x="948" y="860" font-size="18" font-family="Verdana, Arial, sans-serif" fill="#475569">Projetos em foco</text>
  </g>
